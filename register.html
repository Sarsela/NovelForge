<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация — NovelForge</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .invalid-input {
            border-color: #dc3545 !important;
            background-color: #fff0f0 !important;
        }
        .valid-input {
            border-color: #198754 !important;
            background-color: #f0fff0 !important;
        }
        .error-message {
            color: #dc3545;
            font-size: 0.8rem;
            margin-top: 5px;
        }
        .success-message {
            color: #198754;
            font-size: 0.8rem;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="text-center mb-4">
            <h1 class="text-white"><i class="bi bi-person-plus"></i> NovelForge</h1>
            <p class="text-white-50">Создайте новый аккаунт</p>
        </div>

        <div class="nav-links">
            <a href="index.html">Главная</a>
            <a href="login.html">Вход</a>
            <a href="register.html">Регистрация</a>
        </div>

        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="glass-card">
                    <h3 class="text-center mb-4"><i class="bi bi-person-badge"></i> Регистрация</h3>
                    
                    <form id="registerForm">
                        <div class="mb-3">
                            <label class="form-label">Имя пользователя</label>
                            <input type="text" class="form-control" id="regName" placeholder="Анна" required>
                            <div id="nameError" class="error-message"></div>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input type="email" class="form-control" id="regEmail" placeholder="example@mail.ru" required>
                            <div id="emailError" class="error-message"></div>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">Пароль</label>
                            <input type="password" class="form-control" id="regPassword" placeholder="минимум 6 символов" required>
                            <div id="passwordError" class="error-message"></div>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">Подтверждение пароля</label>
                            <input type="password" class="form-control" id="regPasswordConfirm" required>
                            <div id="confirmError" class="error-message"></div>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">Я хочу</label>
                            <select class="form-control" id="regRole">
                                <option value="reader">Читать новеллы</option>
                                <option value="author">Создавать новеллы</option>
                            </select>
                        </div>
                        
                        <button type="submit" class="btn btn-primary w-100" id="registerBtn">
                            <i class="bi bi-check-circle"></i> Зарегистрироваться
                        </button>
                    </form>
                    <div id="registerMessage" class="mt-3 text-center"></div>
                    <hr>
                    <p class="text-muted small text-center">
                        Уже есть аккаунт? <a href="login.html">Войдите</a>
                    </p>
                </div>
            </div>
        </div>
        
        <footer>
            <small>© 2025 NovelForge — конструктор визуальных новелл</small>
        </footer>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/auth.js"></script>
    <script>
        if (isUserLoggedIn()) {
            window.location.href = "index.html";
        }
        
        const nameInput = document.getElementById("regName");
        const emailInput = document.getElementById("regEmail");
        const passwordInput = document.getElementById("regPassword");
        const confirmInput = document.getElementById("regPasswordConfirm");
        const roleSelect = document.getElementById("regRole");
        const registerBtn = document.getElementById("registerBtn");
        
        const nameError = document.getElementById("nameError");
        const emailError = document.getElementById("emailError");
        const passwordError = document.getElementById("passwordError");
        const confirmError = document.getElementById("confirmError");
        
        function validateName() {
            const name = nameInput.value.trim();
            if (name.length < 3) {
                nameInput.classList.add("invalid-input");
                nameInput.classList.remove("valid-input");
                nameError.textContent = "❌ Имя должно быть не менее 3 символов";
                return false;
            }
            if (name.length > 30) {
                nameInput.classList.add("invalid-input");
                nameInput.classList.remove("valid-input");
                nameError.textContent = "❌ Имя не должно превышать 30 символов";
                return false;
            }
            nameInput.classList.remove("invalid-input");
            nameInput.classList.add("valid-input");
            nameError.textContent = "✅";
            return true;
        }
        
        function validateEmail() {
            const email = emailInput.value.trim();
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(email)) {
                emailInput.classList.add("invalid-input");
                emailInput.classList.remove("valid-input");
                emailError.textContent = "❌ Введите корректный email (example@mail.ru)";
                return false;
            }
            if (userExists(email)) {
                emailInput.classList.add("invalid-input");
                emailInput.classList.remove("valid-input");
                emailError.textContent = "❌ Пользователь с таким email уже существует";
                return false;
            }
            emailInput.classList.remove("invalid-input");
            emailInput.classList.add("valid-input");
            emailError.textContent = "✅";
            return true;
        }
        
        function validatePassword() {
            const password = passwordInput.value;
            if (password.length < 6) {
                passwordInput.classList.add("invalid-input");
                passwordInput.classList.remove("valid-input");
                passwordError.textContent = "❌ Пароль должен быть не менее 6 символов";
                return false;
            }
            if (password.length > 50) {
                passwordInput.classList.add("invalid-input");
                passwordInput.classList.remove("valid-input");
                passwordError.textContent = "❌ Пароль не должен превышать 50 символов";
                return false;
            }
            passwordInput.classList.remove("invalid-input");
            passwordInput.classList.add("valid-input");
            passwordError.textContent = "✅";
            return true;
        }
        
        function validateConfirm() {
            const password = passwordInput.value;
            const confirm = confirmInput.value;
            if (password !== confirm) {
                confirmInput.classList.add("invalid-input");
                confirmInput.classList.remove("valid-input");
                confirmError.textContent = "❌ Пароли не совпадают";
                return false;
            }
            if (confirm === "") {
                confirmInput.classList.add("invalid-input");
                confirmInput.classList.remove("valid-input");
                confirmError.textContent = "❌ Подтвердите пароль";
                return false;
            }
            confirmInput.classList.remove("invalid-input");
            confirmInput.classList.add("valid-input");
            confirmError.textContent = "✅";
            return true;
        }
        
        nameInput.addEventListener("input", validateName);
        emailInput.addEventListener("input", validateEmail);
        passwordInput.addEventListener("input", () => {
            validatePassword();
            if (confirmInput.value) validateConfirm();
        });
        confirmInput.addEventListener("input", validateConfirm);
        
        registerForm.addEventListener("submit", async function(e) {
            e.preventDefault();
            
            const isNameValid = validateName();
            const isEmailValid = await validateEmail();
            const isPasswordValid = validatePassword();
            const isConfirmValid = validateConfirm();
            
            if (!isNameValid || !isEmailValid || !isPasswordValid || !isConfirmValid) {
                showMessage("❌ Пожалуйста, исправьте ошибки в форме", "danger");
                return;
            }
            
            registerBtn.disabled = true;
            registerBtn.innerHTML = '<i class="bi bi-hourglass-split"></i> Регистрация...';
            
            const name = nameInput.value.trim();
            const email = emailInput.value.trim();
            const password = passwordInput.value;
            const role = roleSelect.value;
            
            try {
                await saveUser(email, name, password, role);
                await loginUser(email, password);
                
                showMessage("✅ Регистрация успешна!", "success");
                
                setTimeout(() => {
                    if (role === "author") {
                        window.location.href = "editorNovel.html";
                    } else {
                        window.location.href = "index.html";
                    }
                }, 1500);
            } catch (error) {
                console.error(error);
                showMessage("❌ Ошибка при регистрации", "danger");
                registerBtn.disabled = false;
                registerBtn.innerHTML = '<i class="bi bi-check-circle"></i> Зарегистрироваться';
            }
        });
        
        function showMessage(msg, type) {
            const div = document.getElementById("registerMessage");
            div.innerHTML = `<div class="alert alert-${type}">${msg}</div>`;
            setTimeout(() => div.innerHTML = "", 4000);
        }
    </script>
</body>
</html>
