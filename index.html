<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NovelForge — каталог визуальных новелл</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <div class="text-center mb-4">
            <h1 class="text-white"><i class="bi bi-journal-bookmark-fill"></i> NovelForge</h1>
            <p class="text-white-50">Платформа для чтения и создания визуальных новелл</p>
        </div>

        <div class="nav-links" id="navLinks">
            <a href="index.html">Главная</a>
            <a href="#" id="editorNavLink" style="display: none;">Мои новеллы</a>
            <a href="login.html" id="loginNavLink">Вход</a>
            <a href="register.html" id="registerNavLink">Регистрация</a>
            <span id="userGreeting" style="display: none; background: white; padding: 8px 20px; border-radius: 40px; color: #667eea;">
                <span id="userName"></span>
            </span>
            <a href="#" id="logoutNavLink" style="display: none;">Выйти</a>
        </div>


        <div class="glass-card mb-4">
            <div class="row g-3">
                <div class="col-md-5">
                    <input type="text" id="searchInput" class="search-bar" placeholder="🔍 Поиск новелл...">
                </div>
                <div class="col-md-3">
                    <select id="genreFilter" class="form-select search-bar">
                        <option value="all">Все жанры</option>
                        <option value="Романтика">Романтика</option>
                        <option value="Фэнтези">Фэнтези</option>
                        <option value="Научная фантастика">Научная фантастика</option>
                        <option value="Детектив">Детектив</option>
                        <option value="Ужасы">Ужасы</option>
                        <option value="Приключения">Приключения</option>
                        <option value="Комедия">Комедия</option>
                        <option value="Драма">Драма</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <select id="sortFilter" class="form-select search-bar">
                        <option value="popular">По популярности</option>
                        <option value="newest">По дате добавления</option>
                        <option value="rating">По рейтингу</option>
                    </select>
                </div>
                <div class="col-md-1">
                    <button class="btn btn-primary w-100" id="resetFiltersBtn">Сброс</button>
                </div>
            </div>
        </div>

        <div id="novelsContainer" class="row g-4">

        </div>
        
        <footer>
            <small>© 2025 NovelForge — конструктор визуальных новелл</small>
        </footer>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/editor.js"></script>
    <script>
        let currentUser = null;
        
        function updateNavigation() {
            const isLoggedIn = isUserLoggedIn();
            currentUser = getCurrentUser();
            
            const editorNavLink = document.getElementById("editorNavLink");
            const loginNavLink = document.getElementById("loginNavLink");
            const registerNavLink = document.getElementById("registerNavLink");
            const logoutNavLink = document.getElementById("logoutNavLink");
            const userGreeting = document.getElementById("userGreeting");
            const userNameSpan = document.getElementById("userName");
            
            if (isLoggedIn && currentUser) {
                if (editorNavLink) {
                    editorNavLink.style.display = "inline-block";
                    editorNavLink.href = currentUser.role === "author" ? "editorNovel.html" : "profile.html";
                    editorNavLink.textContent = currentUser.role === "author" ? "Редактор" : "Мой профиль";
                }
                if (loginNavLink) loginNavLink.style.display = "none";
                if (registerNavLink) registerNavLink.style.display = "none";
                if (logoutNavLink) logoutNavLink.style.display = "inline-block";
                if (userGreeting) userGreeting.style.display = "inline-block";
                if (userNameSpan) userNameSpan.textContent = currentUser.name;
                
                logoutNavLink.onclick = (e) => { e.preventDefault(); logout(); };
            } else {
                if (editorNavLink) editorNavLink.style.display = "none";
                if (loginNavLink) loginNavLink.style.display = "inline-block";
                if (registerNavLink) registerNavLink.style.display = "inline-block";
                if (logoutNavLink) logoutNavLink.style.display = "none";
                if (userGreeting) userGreeting.style.display = "none";
            }
        }
        
        function renderNovels() {
            let novels = getNovels();
            const searchTerm = document.getElementById("searchInput")?.value.toLowerCase() || "";
            const genre = document.getElementById("genreFilter")?.value || "all";
            const sort = document.getElementById("sortFilter")?.value || "popular";
            
            let filtered = novels.filter(n => {
                const matchSearch = n.title.toLowerCase().includes(searchTerm) || n.description.toLowerCase().includes(searchTerm);
                const matchGenre = genre === "all" || n.genre === genre;
                return matchSearch && matchGenre;
            });
            
            if (sort === "popular") filtered.sort((a, b) => b.views - a.views);
            else if (sort === "newest") filtered.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
            else if (sort === "rating") filtered.sort((a, b) => b.rating - a.rating);
            
            const container = document.getElementById("novelsContainer");
            if (!container) return;
            
            if (filtered.length === 0) {
                container.innerHTML = `<div class="col-12"><div class="glass-card text-center">Новелл не найдено. Попробуйте изменить фильтры.</div></div>`;
                return;
            }
            
            container.innerHTML = filtered.map(novel => `
                <div class="col-md-6 col-lg-4">
                    <div class="novel-card glass-card h-100" onclick="openNovel('${novel.id}')">
                        <div class="text-center mb-3">
                            <i class="bi bi-journal-bookmark" style="font-size: 60px; color: #667eea;"></i>
                        </div>
                        <h5 class="fw-bold">${escapeHtml(novel.title)}</h5>
                        <p class="small text-muted">${escapeHtml(novel.author)}</p>
                        <p class="small">${escapeHtml(novel.description.substring(0, 100))}...</p>
                        <div class="d-flex justify-content-between align-items-center mt-2">
                            <span class="badge bg-secondary">${novel.genre || "Без жанра"}</span>
                            <span class="rating">${"⭐".repeat(Math.floor(novel.rating || 0))} ${novel.rating ? novel.rating.toFixed(1) : "Нет оценок"}</span>
                        </div>
                        <div class="d-flex justify-content-between mt-2 small text-muted">
                            <span><i class="bi bi-eye"></i> ${novel.views || 0}</span>
                            <span><i class="bi bi-chat"></i> ${getComments(novel.id).length}</span>
                        </div>
                    </div>
                </div>
            `).join("");
        }
        
        function escapeHtml(str) {
            if (!str) return "";
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }
        
        function openNovel(novelId) {
            incrementViews(novelId);
            window.location.href = `reader.html?id=${novelId}`;
        }
        
        document.getElementById("searchInput")?.addEventListener("input", renderNovels);
        document.getElementById("genreFilter")?.addEventListener("change", renderNovels);
        document.getElementById("sortFilter")?.addEventListener("change", renderNovels);
        document.getElementById("resetFiltersBtn")?.addEventListener("click", () => {
            document.getElementById("searchInput").value = "";
            document.getElementById("genreFilter").value = "all";
            document.getElementById("sortFilter").value = "popular";
            renderNovels();
        });
        
        updateNavigation();
        renderNovels();
    </script>
</body>
</html>
